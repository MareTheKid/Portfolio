<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A portfolio website.">
    <title>Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f5f3ef;
        color: #24211e;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
      }

      main {
        width: min(100%, 42rem);
      }

      p {
        color: #625b53;
        line-height: 1.7;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: -0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portfolio</h1>
      <p>Add your pages and assets to this repository and link them here. This
        static site can be hosted locally or deployed to Vercel.</p>
    </main>
  </body>
</html>
